<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Declassified</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f3f4;--ink:#111316;--mid:#6f747c;--dim:#a3a7ad;--glass:rgba(255,255,255,.62);--line:rgba(17,19,22,.08);--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}a{color:inherit}
#stage{position:relative;width:100%;height:600px;overflow:hidden;background:var(--bg);user-select:none;-webkit-user-select:none;border-radius:0}
body.vp #stage{height:100dvh}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab;outline:0}#gl.drag{cursor:grabbing}
.ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 4px 14px rgba(20,24,32,.08);transition:background .2s,transform .2s,opacity .3s}
.ic:active{transform:scale(.94)}.ic:focus{outline:0}.ic:focus-visible{outline:2px solid rgba(17,19,22,.35);outline-offset:2px}.ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dark .ic{background:rgba(255,255,255,.14);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.18) inset}
#top{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;align-items:center;z-index:5;pointer-events:none}#top>*{pointer-events:auto}
#top .sp{flex:1}
#flag{width:34px;height:34px;padding:0;overflow:hidden}#flag img,#flag svg{width:20px;height:20px;border-radius:50%;stroke:none}
#back{opacity:0;pointer-events:none}body.in #back{opacity:1;pointer-events:auto}body.in #flag,body.in #search,body.in #dice{opacity:0;pointer-events:none}
#tname{position:absolute;left:60px;right:60px;top:84px;text-align:center;font-size:12.5px;font-weight:500;letter-spacing:.01em;z-index:4;opacity:0;transition:opacity .4s;pointer-events:none}body.in #tname{opacity:1}
#pill{position:absolute;left:0;top:0;transform:translate(-50%,-50%);padding:9px 20px;border-radius:999px;font-size:15px;font-weight:500;letter-spacing:.01em;color:#fff;white-space:nowrap;z-index:3;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 8px 30px rgba(0,0,0,.18);text-shadow:0 1px 8px rgba(0,0,0,.25);transition:opacity .25s;pointer-events:auto;cursor:pointer}
#pill.out{opacity:0;pointer-events:none}
#dots{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:6px;z-index:4;pointer-events:none}
#dots i{width:5px;height:5px;border-radius:3px;background:currentColor;opacity:.22;transition:width .35s cubic-bezier(.2,.8,.2,1),opacity .35s}#dots i.on{width:16px;opacity:.75}
body.in #dots{color:#fff}
#label{position:absolute;left:24px;right:24px;bottom:40px;text-align:center;z-index:4;color:#fff;opacity:0;transition:opacity .35s;pointer-events:none}
body.in #label{opacity:1}#label b{display:block;font-size:15px;font-weight:500;line-height:1.3;letter-spacing:.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#label span{display:block;margin-top:3px;font-size:12px;opacity:.6}
.nav{position:absolute;top:50%;margin-top:-17px;z-index:4;opacity:0;transition:opacity .25s}#stage:hover .nav.can{opacity:1}.nav.l{left:12px}.nav.r{right:12px}
@media (hover:none){.nav{display:none}}
#load{position:absolute;inset:0;display:grid;place-items:center;z-index:9;background:var(--bg);transition:opacity .7s}#load i{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c9ced6 45%,#6d7686 100%);box-shadow:0 18px 28px -14px rgba(30,40,60,.45);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(.88)}}
#err{position:absolute;inset:0;display:grid;place-items:center;z-index:10;background:var(--bg);color:var(--mid);text-align:center;padding:30px}
/* viewer */
#viewer{outline:0;position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:vin .38s cubic-bezier(.2,.8,.2,1)}
#viewer.dark{background:#07090c;color:#fff}
@keyframes vin{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
#vh{display:flex;align-items:center;gap:8px;padding:12px;flex:none;position:relative;z-index:2}
#vt{flex:1;min-width:0;text-align:center}#vt b{display:block;font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#vt span{display:block;font-size:11.5px;color:var(--mid);margin-top:1px}
#viewer.dark #vt span{color:rgba(255,255,255,.55)}
#vb{flex:1;min-height:0;position:relative;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pages{padding:4px 16px 70px;display:flex;flex-direction:column;align-items:center;gap:14px}
.pg{width:100%;max-width:760px;background:#fff;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 12px 30px -12px rgba(30,40,60,.25);position:relative;overflow:hidden}
.pg img{display:block;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .4s}.pg img.ok{opacity:1}
.more{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:760px;padding:22px;border-radius:14px;background:rgba(255,255,255,.6);text-decoration:none;font-weight:500;color:var(--ink)}
.more svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7}
#pc{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:3;padding:5px 11px;border-radius:999px;background:rgba(17,19,22,.72);color:#fff;font-size:11.5px;font-variant-numeric:tabular-nums;pointer-events:none;transition:opacity .3s}
.media{position:absolute;inset:0;display:grid;place-items:center;padding:0 0 12px}
.media video{max-width:100%;max-height:100%;width:100%;background:#000;outline:0}
.media img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;transition:transform .3s cubic-bezier(.2,.8,.2,1);cursor:zoom-in;touch-action:none}
.media img.z{cursor:grab;transition:none}
.aud{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;height:100%;padding-bottom:30px}
.aorb{width:min(46vw,190px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 36% 28%,#fdfdfe 0,#c5ccd6 26%,#6f7c90 62%,#2b3442 100%);box-shadow:0 34px 40px -22px rgba(30,40,60,.5);transition:transform .08s linear}
.actl{display:flex;align-items:center;gap:14px;width:min(86%,420px)}
.actl .ic{width:44px;height:44px;flex:none;background:#111316;color:#fff}.actl .ic svg{width:18px;height:18px}
.abar{flex:1;height:22px;position:relative;cursor:pointer;touch-action:none}.abar:before{content:"";position:absolute;left:0;right:0;top:10px;height:2px;border-radius:2px;background:rgba(17,19,22,.12)}.abar i{position:absolute;left:0;top:10px;height:2px;border-radius:2px;background:var(--ink)}.abar u{position:absolute;top:5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--ink)}
.atime{font-size:11.5px;color:var(--mid);font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;overflow:auto;z-index:6;background:rgba(250,250,251,.94);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);color:var(--ink);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.14);padding:8px 18px 22px;animation:sup .32s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
@keyframes sup{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.14);margin:2px auto 12px}
.sheet p{margin:0 0 14px;font-size:14px;line-height:1.5}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:12.5px}.kv span{color:var(--mid)}.kv a{text-decoration:none;font-weight:500;overflow-wrap:anywhere}.kv a:after{content:" ↗"}
.toc{list-style:none;margin:0;padding:0}.toc li button{display:flex;gap:12px;width:100%;text-align:left;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.35}.toc li button span{flex:1}.toc li button em{font-style:normal;color:var(--mid);font-size:12px;font-variant-numeric:tabular-nums}
.toc .toc{padding-left:14px}.toc .toc li button{font-size:13px;color:#3a3f46}
/* search */
#find{position:absolute;inset:0;z-index:15;background:rgba(243,243,244,.86);-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);display:flex;flex-direction:column;animation:vin .3s cubic-bezier(.2,.8,.2,1)}
#fh{display:flex;gap:8px;align-items:center;padding:12px}
#q{flex:1;height:38px;border-radius:999px;border:0;background:rgba(255,255,255,.85);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 4px 14px rgba(20,24,32,.07);padding:0 16px;font:15px var(--font);color:var(--ink);outline:0}
#fr{flex:1;overflow:auto;padding:4px 12px 20px;overscroll-behavior:contain}
.hit{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:8px 6px;border-radius:12px}.hit:hover,.hit:focus-visible{background:rgba(255,255,255,.7);outline:0}
.hit .th{width:40px;height:40px;border-radius:8px;flex:none;background:#e3e5e8 center/cover no-repeat;position:relative}
.hit .th.orb{border-radius:50%}
.hit b{display:block;font-size:13.5px;font-weight:500;line-height:1.3}.hit span{display:block;font-size:12px;color:var(--mid);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 6px 0}.chips button{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:rgba(255,255,255,.75);font-size:13px;font-weight:500}.chips i{width:18px;height:18px;border-radius:50%}
body.shot #top,body.shot #dots,body.shot #pill,body.shot #label,body.shot .nav,body.shot #tname,body.shot #load{display:none!important}
#redact{display:none}body.shot-logo #redact{display:block;position:absolute;left:24%;top:41%;width:52%;height:7.4%;border-radius:4px;background:#0e1013;z-index:3;box-shadow:0 6px 18px rgba(0,0,0,.22)}body.shot-logo #redact:after{content:"";position:absolute;left:0;top:165%;width:62%;height:100%;border-radius:4px;background:#0e1013;box-shadow:0 6px 18px rgba(0,0,0,.22)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<section id="stage" aria-label="Declassified files">
<canvas id="gl" tabindex="0" aria-label="Topics. Swipe to browse, tap to open."></canvas>
<div id="top">
<button class="ic" id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="ic" id="flag" aria-label="United States"><svg viewBox="0 0 20 20"><defs><clipPath id="fc"><circle cx="10" cy="10" r="10"/></clipPath></defs><g clip-path="url(#fc)"><rect width="20" height="20" fill="#f4f4f4"/><g fill="#c8323c"><rect y="0" width="20" height="1.54"/><rect y="3.08" width="20" height="1.54"/><rect y="6.15" width="20" height="1.54"/><rect y="9.23" width="20" height="1.54"/><rect y="12.31" width="20" height="1.54"/><rect y="15.38" width="20" height="1.54"/><rect y="18.46" width="20" height="1.54"/></g><rect width="9.5" height="10.77" fill="#273f7a"/></g></svg></button>
<span class="sp"></span>
<button class="ic" id="dice" aria-label="Random file"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r=".9" fill="currentColor"/><circle cx="15" cy="15" r=".9" fill="currentColor"/><circle cx="15" cy="9" r=".9" fill="currentColor"/><circle cx="9" cy="15" r=".9" fill="currentColor"/></svg></button>
<button class="ic" id="search" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg></button>
</div>
<div id="tname"></div>
<button id="pill" class="out"></button>
<button class="ic nav l" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="ic nav r" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
<div id="redact"></div>
<div id="label"><b></b><span></span></div>
<div id="dots"></div>
<div id="load"><i></i></div>
<div id="err" hidden></div>
</section>
<script>globalThis.__ASSETS__ = "https://abstracts-co.github.io/declassified-data/";</script><script type="module" src="app.js"></script>
</body></html>
